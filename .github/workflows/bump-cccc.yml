name: Check for cccc updates

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Force check even if versions match"
        required: false
        default: "false"

concurrency:
  group: bump-cccc
  cancel-in-progress: true

jobs:
  bump-cccc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TAP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run bump script
        env:
          GH_TOKEN: ${{ secrets.TAP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x .github/scripts/bump-cccc.sh
          ./.github/scripts/bump-cccc.sh "${{ github.event.inputs.force || 'false' }}"
